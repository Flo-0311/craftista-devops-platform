apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: example.com
    privateKeySecretRef:
      name: crafista-issuer-account-key
    solvers:
    - http01:
        ingress:
          class: traefik