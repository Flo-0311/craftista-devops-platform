name: Build Recommendation
on:
  push:
    branches:
      - master
    paths:
      - 'recommendation/**'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/devops-certification-project-recco:latest ./recommendation
      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/devops-certification-project-recco:latest
          format: table
          exit-code: '0'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          vuln-type: 'os,library'
      - name: Push
        run: docker push ${{ secrets.DOCKER_USERNAME }}/devops-certification-project-recco:latest
