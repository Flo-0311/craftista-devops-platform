name: Build Catalogue
on:
  push:
    branches:
      - master
    paths:
      - 'catalogue/**'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: cd catalogue && pip install -r requirements.txt
      - name: Unit-Test
        run: cd catalogue && python -m unittest test_app.py -v
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/devops-certification-project-catalogue:latest ./catalogue
      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/devops-certification-project-catalogue:latest
          format: table
          exit-code: '0'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          vuln-type: 'os,library'
      - name: Push
        run: docker push ${{ secrets.DOCKER_USERNAME }}/devops-certification-project-catalogue:latest
